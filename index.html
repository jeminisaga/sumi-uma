<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>墨の山 ― 馬の旅人</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe6d2;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #paper{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  #vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(60,40,20,.28) 100%)}
  #hud{position:fixed;left:18px;top:14px;color:#2a2420;pointer-events:none}
  #hud h1{margin:0;font-size:22px;letter-spacing:.2em}
  #hud .t{font-size:15px;margin-top:4px;opacity:.8}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:#2a2420;font-size:17px;background:rgba(239,230,210,.75);padding:6px 16px;border-radius:4px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(239,230,210,.86);color:#211b17;z-index:5}
  #title h2{font-size:44px;letter-spacing:.3em;margin:0 0 10px}
  #title p{margin:4px;font-size:16px;opacity:.85}
  #title button,#end button{margin-top:22px;font:inherit;font-size:20px;padding:10px 34px;background:#2a2420;color:#efe6d2;border:none;border-radius:3px;cursor:pointer}
  #end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(239,230,210,.8);color:#211b17;z-index:5}
  #end h2{font-size:52px;letter-spacing:.4em;margin:0}
  .seal{display:inline-block;color:#b8322a;border:2px solid #b8322a;padding:2px 6px;font-size:14px;margin-top:10px}
  #stick{position:fixed;left:26px;bottom:26px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(42,36,32,.35);display:none;z-index:3}
  #knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(42,36,32,.45)}
  #jump{position:fixed;right:30px;bottom:40px;width:96px;height:96px;border-radius:50%;background:rgba(42,36,32,.55);color:#efe6d2;font-size:22px;display:none;align-items:center;justify-content:center;z-index:3}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="paper"></div><div id="vign"></div>
<div id="hud"><h1>墨の山</h1><div class="t" id="timer">0.0 秒</div></div>
<div id="hint">左右・前後で歩く／スペースで跳ぶ</div>
<div id="title"><h2>墨の山</h2><p>馬の旅人、山の上の鳥居をめざす。</p><p>PC：矢印キーかWASDで歩く・スペースで跳ぶ／スマホ：左で歩く・右で跳ぶ</p><button id="start">はじめる</button><span class="seal">AIと作った小さな遊び</span></div>
<div id="end"><h2>到着</h2><p id="endt"></p><button id="again">もう一度</button></div>
<div id="stick"><div id="knob"></div></div><div id="jump">跳</div>
<script type="module" src="main.js"></script>
</body>
</html>
